PLG_SYSTEM_SYSBREEZINGFORMS_XML_DESCRIPTION="Erforderliches System-Plugin für BreezingForms NG (com_breezingformsng) — muss aktiviert bleiben, damit die Komponente korrekt funktioniert. Es entfernt überschüssige Icon-Markierungen, die andernfalls in den rohen HTML-Code der Bildschirme Menüs und Kontrollzentrum gelangen können."
